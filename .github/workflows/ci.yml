name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 and up: `--test-force-exit`, which keeps a failing shutdown test
        # from hanging the job until the runner times out, needs node 22 — and
        # so does the toolchain (electron pins 22.12, ink 7 needs 22).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
        # Prettier is configured (.prettierrc) but the tree is not formatted yet,
        # so `prettier --check` is intentionally NOT a CI step in this pass.
